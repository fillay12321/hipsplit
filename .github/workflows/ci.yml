name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gcc:
    name: core (gcc, no HIP)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners have no ROCm/GPU, so we build the HIP-free
      # planning core and run its unit tests. The HIP layer, the C-ABI shared
      # library and the executor smoke test require a real AMD GPU.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHIPSPLIT_WITH_HIP=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  clang:
    name: core (clang, no HIP)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHIPSPLIT_WITH_HIP=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
